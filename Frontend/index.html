<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Management App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background floating images -->
<img src="images/img01.jpg" class="bg bg1">
<img src="images/img02.jpg" class="bg bg2">
<img src="images/img03.png" class="bg bg3">
<img src="images/img04.jpg" class="bg bg4">

<div class="main-wrapper">
    <div class="container animate-card">
        <h1>📋 Task Management App</h1>
        <p class="subtitle">Organize your work beautifully</p>

        <form id="taskForm">
            <input type="text" id="title" placeholder="Task Title" required>
            <textarea id="description" placeholder="Task Description"></textarea>
            <button type="submit">➕ Add Task</button>
        </form>

        <div id="taskList"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
